spring:
  application:
    name: qrclub
  datasource:
    url:  jdbc:postgresql://localhost:5432/club
    username: club
    password: club
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect